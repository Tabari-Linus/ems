# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
name: Spring Boot CI

# Trigger workflow on pushes and pull requests

on:
push:
branches:
- main
- develop
pull_request:
branches:
- main
- develop

jobs:
build:
name: Build and Test Spring Boot Application
runs-on: ubuntu-latest

```
steps:
  # --------------------------------------------------
  # Checkout Source Code
  # --------------------------------------------------
  - name: Checkout Repository
    uses: actions/checkout@v4

  # --------------------------------------------------
  # Setup Java Environment
  # --------------------------------------------------
  - name: Set Up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'
      cache: maven

  # --------------------------------------------------
  # Grant Execute Permission to Maven Wrapper
  # --------------------------------------------------
  - name: Make Maven Wrapper Executable
    run: chmod +x mvnw

  # --------------------------------------------------
  # Run Unit and Integration Tests
  # --------------------------------------------------
  - name: Run Tests
    run: ./mvnw clean test

  # --------------------------------------------------
  # Build Spring Boot Executable JAR
  # --------------------------------------------------
  - name: Package Application
    run: ./mvnw clean package -DskipTests

  # --------------------------------------------------
  # Upload Build Artifact
  # --------------------------------------------------
  - name: Upload Spring Boot JAR
    uses: actions/upload-artifact@v4
    with:
      name: spring-boot-jar
      path: target/*.jar

  # --------------------------------------------------
  # Submit Dependency Graph to GitHub
  # --------------------------------------------------
  - name: Update Dependency Graph
    uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
```
