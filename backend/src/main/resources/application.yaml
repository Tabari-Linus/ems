# Base configuration: every property the app needs, driven by environment variables.
# Defaults are only provided where they are safe for local development.
# Profiles: dev (local conveniences), prod (hardened), test (automated tests).
# See .env.example for the full list of environment variables.

spring:
  application:
    name: ems

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ems}
    username: ${DB_USERNAME:ems}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  graphql:
    http:
      path: /graphql
    graphiql:
      enabled: false
      path: /graphiql
    schema:
      introspection:
        enabled: false

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
            required: ${MAIL_SMTP_STARTTLS:false}

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState,ping

logging:
  level:
    root: INFO

# RSA key pair used to sign and verify access tokens. Never read from the classpath.
# JWT_PUBLIC_KEY / JWT_PRIVATE_KEY may hold inline PEM content (they win when set);
# otherwise the PEM files at JWT_PUBLIC_KEY_PATH / JWT_PRIVATE_KEY_PATH are used.
jwt:
  public-key: ${JWT_PUBLIC_KEY:file:${JWT_PUBLIC_KEY_PATH:./.keys/jwt-public-key.pem}}
  private-key: ${JWT_PRIVATE_KEY:file:${JWT_PRIVATE_KEY_PATH:./.keys/jwt-private-key.pem}}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# Administrator account seeded on first startup. ADMIN_PASSWORD is required for seeding.
admin:
  email: ${ADMIN_EMAIL:admin@ems.local}
  password: ${ADMIN_PASSWORD:}

app:
  # Base URL of the web app, used for links in emails.
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  mail:
    from: ${MAIL_FROM:no-reply@ems.local}
  cors:
    # Comma-separated list of exact origins; no wildcards.
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}
  auth:
    cookie:
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAMESITE:Lax}
      path: ${AUTH_COOKIE_PATH:/api/v1/auth}
    jwt:
      # Written to and required on every access token (iss / aud).
      issuer: ${JWT_ISSUER:ems-api}
      audience: ${JWT_AUDIENCE:ems-web}
    # Transition flag: also emit the legacy `permissions` and `account_id` claims for the current
    # frontend. Authorization never reads them. Turn off once the frontend uses the `me` query.
    legacy-permissions-claim: ${AUTH_LEGACY_PERMISSIONS_CLAIM:true}
    principal-cache-ttl: ${AUTH_PRINCIPAL_CACHE_TTL:60s}
    lockout:
      max-failed-attempts: ${AUTH_LOCKOUT_MAX_ATTEMPTS:5}
      duration: ${AUTH_LOCKOUT_DURATION:15m}
    rate-limit:
      # Per IP and endpoint, on /login and /set-password.
      capacity: ${AUTH_RATE_LIMIT_CAPACITY:10}
      period: ${AUTH_RATE_LIMIT_PERIOD:1m}
    tokens:
      welcome-ttl: ${AUTH_WELCOME_TOKEN_TTL:72h}
      password-reset-ttl: ${AUTH_PASSWORD_RESET_TOKEN_TTL:1h}
