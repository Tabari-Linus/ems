spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-on-validation-error: true
    baseline-on-migrate: true

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  graphql:
    graphiql:
      enabled: false
  mail:
    host: localhost
    port: 25
    username: test@example.com
    password: test

jwt:
  public-key: classpath:certificates/jwt-public-key.pem
  private-key: classpath:certificates/jwt-private-key.pem
  expiration-ms: 28800000
  refresh-expiration-ms: 86400000
  cookie-secure: false

admin:
  email: admin@test.com
  password: admin123

allowed:
  cors:
    url: http://localhost:3000
