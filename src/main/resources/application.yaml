spring:
  application:
    name: ems

  jpa:
    properties:
      hibernate:
        format_sql: true

  graphql:
    graphiql:
      enabled: false
    http:
      path: /

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState,ping