# Server block for the EMS SPA (installed as /etc/nginx/conf.d/default.conf).
# Static files only: there is deliberately NO reverse proxy to the API. The browser calls
# the API on its own origin (config.json -> apiUrl), exactly like production.
#
# /etc/nginx/ems/security-headers.conf is generated at container start by
# /docker-entrypoint.d/40-ems-runtime-config.sh (it embeds API_URL's origin in the CSP).
# `add_header` is not inherited into a location that defines its own headers, so every
# location that adds headers includes the snippet again.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml
               application/manifest+json text/xml application/xml;

    include /etc/nginx/ems/security-headers.conf;

    # Liveness/readiness probe for the host and docker-compose.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Runtime config must never be cached: it changes per deployment without a rebuild.
    location = /config.json {
        include /etc/nginx/ems/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # The shell is revalidated on every load so a new deployment is picked up immediately.
    location = /index.html {
        include /etc/nginx/ems/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Angular emits content-hashed file names (e.g. main-ABCD1234.js): cache them forever.
    location ~* "-[A-Za-z0-9]{8}\.(?:js|mjs|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$" {
        include /etc/nginx/ems/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # SPA fallback: unknown paths render the app, which handles routing (and its own 404).
    location / {
        include /etc/nginx/ems/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
