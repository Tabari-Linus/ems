<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>EMS</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Theme no-flash (@ems/ui/theme THEME_NO_FLASH_SCRIPT). Allowed by hash in the CSP of
         docker/40-ems-runtime-config.sh; src/theme-no-flash.spec.ts fails if the two drift. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ems-theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
