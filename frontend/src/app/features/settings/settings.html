<div class="settings-page">
  <div class="settings-header">
    <h1>Settings</h1>
    <p>Manage system configuration and organisational structure</p>
  </div>

  <div class="tab-bar">
    @for (tab of tabs; track tab.id) {
      <button
        class="tab-btn"
        [class.active]="activeTab() === tab.id"
        (click)="setTab(tab.id)"
      >
        {{ tab.label }}
      </button>
    }
  </div>

  <div class="tab-body">
    @switch (activeTab()) {
      @case ('companies')     { <app-settings-companies /> }
      @case ('offices')       { <app-settings-offices /> }
      @case ('departments')   { <app-settings-departments /> }
      @case ('positions')     { <app-settings-positions /> }
      @case ('access-levels') { <app-settings-access-levels /> }
    }
  </div>
</div>
