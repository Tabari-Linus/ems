<ui-page-header title="Positions" level="2" [count]="count()">
  <button uiPageHeaderActions uiButton type="button" (click)="toggleForm()">
    <ui-icon name="plus" /> Add position
  </button>
</ui-page-header>

@if (listResource.error()) {
  <ui-card>
    <ui-error-state
      kind="server"
      [headingLevel]="3"
      heading="We couldn't load positions"
      description="Check your connection, then try again. If it keeps happening, contact your EMS admin."
      (action)="listResource.reload()"
    />
  </ui-card>
} @else {
  <ui-card flush>
    <ui-data-table
      caption="Positions"
      loadingLabel="Loading positions"
      [rows]="rows()"
      [loading]="listResource.isLoading()"
      [trackBy]="trackById"
    >
      <ng-container uiColumn="name" header="Position" primary>
        <ng-template uiCell let-p>
          <span class="settings-name">{{ p.positionName }}</span>
        </ng-template>
      </ng-container>
      <ng-container uiColumn="level" header="Level">
        <ng-template uiCell let-p>{{ levelLabel(p.level) }}</ng-template>
      </ng-container>
      <ng-container uiColumn="description" header="Description">
        <ng-template uiCell let-p>
          <span class="settings-wrap settings-muted">{{ p.description ?? '' }}</span>
        </ng-template>
      </ng-container>
      <ng-container uiColumn="status" header="Status">
        <ng-template uiCell let-p>
          @if (statusPillValue(p.status); as status) {
            <ui-status-pill [status]="status" />
          } @else {
            <ui-status-pill>{{ p.status }}</ui-status-pill>
          }
        </ng-template>
      </ng-container>
      <ng-template uiRowActions let-p>
        <button
          uiButton
          variant="ghost"
          size="sm"
          type="button"
          [attr.aria-label]="'Edit ' + p.positionName"
          (click)="startEdit(p)"
        >
          <ui-icon name="pencil" /> Edit
        </button>
      </ng-template>
      <ui-empty-state
        uiTableEmpty
        [headingLevel]="3"
        heading="No positions yet"
        description="Add the roles people hold, with their level, so you can assign them to people."
      >
        <button
          uiEmptyStateActions
          uiButton
          variant="secondary"
          type="button"
          (click)="toggleForm()"
        >
          <ui-icon name="plus" /> Add position
        </button>
      </ui-empty-state>
    </ui-data-table>
  </ui-card>
}

<ng-template #formTpl>
  <ui-drawer
    [heading]="editId() ? 'Edit position' : 'Add position'"
    description="Fields marked * are required."
  >
    <form
      id="positions-position-form"
      class="settings-form"
      novalidate
      (submit)="onSubmit(); $event.preventDefault()"
    >
      @if (formError()) {
        <ui-alert tone="danger" heading="We couldn't save this position">
          {{ formError() }} Check the details and try again.
        </ui-alert>
      }
      <ui-form-field label="Position name" required [error]="fieldError(positionForm.positionName)">
        <input
          uiInput
          id="positions-position-form-position-name"
          autocomplete="off"
          placeholder="Backend Engineer"
          [formField]="positionForm.positionName"
        />
      </ui-form-field>
      <ui-form-field label="Level" required [error]="fieldError(positionForm.level)">
        <select uiSelect id="positions-position-form-level" [formField]="positionForm.level">
          @for (lvl of LEVELS; track lvl) {
            <option [value]="lvl">{{ levelLabel(lvl) }}</option>
          }
        </select>
      </ui-form-field>
      <ui-form-field label="Description" hint="One line on what the role is responsible for.">
        <textarea
          uiInput
          id="positions-position-form-description"
          rows="3"
          placeholder="Builds and runs the services behind EMS."
          [formField]="positionForm.description"
        ></textarea>
      </ui-form-field>
    </form>
    <button uiDrawerAction uiButton variant="secondary" type="button" (click)="showForm.set(false)">
      Cancel
    </button>
    <button
      uiDrawerAction
      uiButton
      type="submit"
      form="positions-position-form"
      [loading]="saving()"
    >
      {{ editId() ? 'Save changes' : 'Add position' }}
    </button>
  </ui-drawer>
</ng-template>
