<ui-app-shell [collapsible]="false">
  <a uiShellBrand routerLink="/home" class="shell-brand" aria-label="EMS, go to Home">
    <app-brand />
  </a>

  <ng-container uiShellNav>
    <a uiNavItem routerLink="/home" routerLinkActive ariaCurrentWhenActive="page">
      <ui-icon uiNavIcon name="home" /> Home
    </a>
    <a uiNavItem routerLink="/people" routerLinkActive ariaCurrentWhenActive="page">
      <ui-icon uiNavIcon name="users" /> People
    </a>
    @if (canViewMyProfile()) {
      <a uiNavItem routerLink="/my-profile" routerLinkActive ariaCurrentWhenActive="page">
        <ui-icon uiNavIcon name="user" /> My profile
      </a>
    }
  </ng-container>

  @if (canViewSettings()) {
    <nav uiShellFooter aria-label="Workspace" class="shell-footer-nav">
      <a uiNavItem routerLink="/settings" routerLinkActive ariaCurrentWhenActive="page">
        <ui-icon uiNavIcon name="settings" /> Settings
      </a>
    </nav>
  }

  <form uiShellSearch role="search" class="shell-search" (submit)="onSearch($event)">
    <ui-search-input
      label="Search people"
      placeholder="Search people"
      shortcut
      [(value)]="search"
    />
  </form>

  <button uiShellUser type="button" class="shell-user" [uiMenuTrigger]="userMenu">
    <ui-avatar
      [name]="session.displayName() || 'You'"
      [tintKey]="session.employee()?.department?.id ?? null"
      size="sm"
      decorative
    />
    <span>
      <span class="ui-visually-hidden">Account menu, </span>
      <span class="shell-user__name">{{ session.displayName() }}</span>
    </span>
    <ui-icon name="chevron-down" size="sm" class="shell-user__chevron" />
  </button>

  <ng-template #userMenu>
    <ui-menu>
      @if (canViewMyProfile()) {
        <button uiMenuItem (triggered)="go('/my-profile')">
          <ui-icon uiMenuItemIcon name="user" size="sm" /> My profile
        </button>
      }
      <button uiMenuItem (triggered)="go('/change-password')">
        <ui-icon uiMenuItemIcon name="key" size="sm" /> Change password
      </button>
      <ui-menu-separator />
      <div role="group" aria-label="Theme">
        @for (option of themeOptions; track option.value) {
          <button
            uiMenuItem
            [attr.role]="'menuitemradio'"
            [attr.aria-checked]="theme.theme() === option.value"
            (triggered)="setTheme(option.value)"
          >
            <ui-icon uiMenuItemIcon [name]="option.icon" size="sm" />
            {{ option.label }}
            @if (theme.theme() === option.value) {
              <ui-icon name="check" size="sm" class="shell-menu-check" />
            }
          </button>
        }
      </div>
      <ui-menu-separator />
      <button uiMenuItem (triggered)="signOut()">
        <ui-icon uiMenuItemIcon name="log-out" size="sm" /> Sign out
      </button>
      <button uiMenuItem (triggered)="signOutEverywhere()">
        <ui-icon uiMenuItemIcon name="log-out" size="sm" /> Sign out of all devices
      </button>
    </ui-menu>
  </ng-template>

  <router-outlet />
</ui-app-shell>
<ui-toaster />
