<app-auth-layout headingId="login-heading">
  <div class="auth-head">
    <h1 id="login-heading">Sign in</h1>
    <p>Use your work account.</p>
  </div>

  @if (passwordSet && !errorCopy()) {
    <ui-alert tone="success" heading="Password set">Sign in with your new password.</ui-alert>
  }
  @if (errorCopy(); as copy) {
    <ui-alert tone="danger" [heading]="copy.heading">{{ copy.text }}</ui-alert>
  }

  <form class="auth-form" novalidate (submit)="onSubmit($event)">
    <ui-form-field label="Work email" [error]="fieldError('email')">
      <input uiInput type="email" autocomplete="username" [formField]="loginForm.email" />
    </ui-form-field>

    <ui-form-field label="Password" [error]="fieldError('password')">
      <ui-password-input autocomplete="current-password" [formField]="loginForm.password" />
    </ui-form-field>

    <button uiButton size="lg" type="submit" [loading]="loading()">Sign in</button>
  </form>

  <div class="auth-note">
    <ui-icon name="info" size="sm" />
    <p>
      <b>Forgot your password?</b> Ask People Operations to send you a new link to set one.
    </p>
  </div>
</app-auth-layout>
