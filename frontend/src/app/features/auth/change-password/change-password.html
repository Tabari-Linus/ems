<ui-page-header
  title="Change password"
  description="You stay signed in here. Every other device is signed out."
/>

<ui-card class="change-password-card">
  @if (formError(); as text) {
    <ui-alert tone="danger" heading="We could not change your password">{{ text }}</ui-alert>
  }

  <form class="change-password-form" novalidate (submit)="onSubmit($event)">
    <ui-form-field label="Current password" [error]="fieldError('current')">
      <ui-password-input
        autocomplete="current-password"
        revealLabel="Show current password"
        [value]="passwordForm.current().value()"
        (valueChange)="passwordForm.current().value.set($event)"
        (focusout)="passwordForm.current().markAsTouched()"
        (input)="currentError.set(null)"
      />
    </ui-form-field>

    <ui-form-field
      label="New password"
      hint="At least 10 characters, without your email name."
      [error]="fieldError('password')"
    >
      <ui-password-input
        autocomplete="new-password"
        revealLabel="Show new password"
        showStrength
        [value]="passwordForm.password().value()"
        (valueChange)="passwordForm.password().value.set($event)"
        (focusout)="passwordForm.password().markAsTouched()"
        (input)="newError.set(null)"
      />
    </ui-form-field>

    <ui-form-field label="Confirm new password" [error]="fieldError('confirm')">
      <ui-password-input
        autocomplete="new-password"
        revealLabel="Show confirmation"
        [value]="passwordForm.confirm().value()"
        (valueChange)="passwordForm.confirm().value.set($event)"
        (focusout)="passwordForm.confirm().markAsTouched()"
      />
    </ui-form-field>

    <div class="change-password-actions">
      <a uiButton variant="ghost" routerLink="/home">Cancel</a>
      <button uiButton type="submit" [loading]="loading()">Change password</button>
    </div>
  </form>
</ui-card>
